name: Publish Python Package to PyPI

# Builds binary wheels for every supported platform, plus an sdist, and publishes
# them on release.
#
# Why this is not `poetry build -f sdist` any more: this package contains a Cython
# extension. Publishing only an sdist meant every `pip install dead-band`
# compiled it from source, so end users needed a C toolchain and Python headers --
# `build-essential python3-dev` on Linux, Visual C++ Build Tools on Windows. The
# README used to open with those instructions. With wheels, `pip install dead-band`
# is a download and an unpack.
#
# cibuildwheel does the per-platform work: it spins up the manylinux/macOS/Windows
# environments, builds one wheel per (CPython version, platform, architecture), and
# runs the test import inside each of them before the wheel is allowed out.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload to PyPI. Leave unchecked for a build-only dry run of the whole
          matrix.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-latest
            arch: arm64
          # Intel macOS needs an explicit label: macos-latest and macos-15 are
          # arm64. Do NOT use `macos-13` -- that image was retired, and a job
          # requesting it is never assigned a runner. It does not fail; it sits
          # in `queued` until GitHub's 24h ceiling, and because `publish` needs
          # every wheel job, the whole release hangs behind it. That is what
          # happened to the v1.2 release (run 32281506482, queued 1h+ before it
          # was cancelled by hand).
          #
          # Current Intel labels are `macos-15-intel` and `macos-26-intel`.
          # 15 is chosen over 26 deliberately: building on the older macOS gives
          # a lower MACOSX_DEPLOYMENT_TARGET, so the wheel supports more macOS
          # versions. Check actions/runner-images before changing this.
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # requires-python is >=3.10; 3.14 is included and verified to build.
          # PyPy is excluded: the extension is built against the CPython datetime
          # C API (cpython.datetime), which PyPy does not provide.
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_i686 pp*"
          # Import the built wheel in a clean environment and assert the compiled
          # path is the one that loaded. This is what stops a wheel that silently
          # fell back to pure Python from being published as a binary wheel.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import dead_band; assert dead_band.CYTHON_AVAILABLE, 'wheel has no compiled extension'; print('compiled extension OK')"
            && pytest {project}/tests -q

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Still published: it is the fallback for any platform or Python version
      # the matrix above does not cover, and the guarded import in deadband.py
      # means a source install without a compiler degrades to pure Python rather
      # than failing.
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Verify the sdist can be installed and imported
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import dead_band; print('sdist import OK, compiled =', dead_band.CYTHON_AVAILABLE)"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # A release always publishes. A manual run publishes only when explicitly
    # asked, so the default `workflow_dispatch` remains a safe dry run of the
    # whole matrix.
    if: github.event_name == 'release' || inputs.publish
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # twine rather than pypa/gh-action-pypi-publish.
      #
      # That action is a composite action that generates a Docker container
      # action pointing at ghcr.io/pypa/gh-action-pypi-publish:${REF}, where REF
      # is whatever you pinned it to. Images are published for release tags, not
      # for arbitrary commits, so pinning it by commit SHA -- the thing every
      # other action here does for supply-chain reasons -- makes it fail with
      # `manifest unknown` before it does any work. That killed the v1.2_release
      # attempt (run 32289625929) after all six wheel jobs had succeeded.
      #
      # The alternatives were to pin it by moving tag, or to not use it. twine is
      # the tool it wraps, it is two lines, and it pulls no container. Note also
      # that this project publishes with an API token rather than Trusted
      # Publishing, so the action's PEP 740 attestations -- which require OIDC --
      # were never going to be produced anyway.
      - name: Install twine
        run: pip install "twine>=7.0,<8"

      - name: Show and validate what is about to be published
        run: |
          ls -lh dist
          # Catches malformed metadata and a README that PyPI would refuse to
          # render, before anything is uploaded and the version is spent.
          twine check --strict dist/*

      # --skip-existing makes a retry idempotent. If an upload dies partway
      # through -- 36 files go up here -- PyPI keeps the ones that landed and
      # rejects a re-upload of them with a 400, so without this a retry fails on
      # files that are already correct. PyPI never allows overwriting an existing
      # file, so this cannot mask a changed artifact; it only skips identical
      # filenames.
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
