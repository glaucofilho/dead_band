name: Publish Python Package to PyPI

# Builds binary wheels for every supported platform, plus an sdist, and publishes
# them on release.
#
# Why this is not `poetry build -f sdist` any more: this package contains a Cython
# extension. Publishing only an sdist meant every `pip install dead-band`
# compiled it from source, so end users needed a C toolchain and Python headers --
# `build-essential python3-dev` on Linux, Visual C++ Build Tools on Windows. The
# README used to open with those instructions. With wheels, `pip install dead-band`
# is a download and an unpack.
#
# cibuildwheel does the per-platform work: it spins up the manylinux/macOS/Windows
# environments, builds one wheel per (CPython version, platform, architecture), and
# runs the test import inside each of them before the wheel is allowed out.

on:
  release:
    types: [published]
  # Allows a dry run of the whole matrix without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          # requires-python is >=3.10; 3.14 is included and verified to build.
          # PyPy is excluded: the extension is built against the CPython datetime
          # C API (cpython.datetime), which PyPy does not provide.
          CIBW_BUILD: cp310-* cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-musllinux_i686 pp*"
          # Import the built wheel in a clean environment and assert the compiled
          # path is the one that loaded. This is what stops a wheel that silently
          # fell back to pure Python from being published as a binary wheel.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import dead_band; assert dead_band.CYTHON_AVAILABLE, 'wheel has no compiled extension'; print('compiled extension OK')"
            && pytest {project}/tests -q

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Still published: it is the fallback for any platform or Python version
      # the matrix above does not cover, and the guarded import in deadband.py
      # means a source install without a compiler degrades to pure Python rather
      # than failing.
      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - name: Verify the sdist can be installed and imported
        run: |
          python -m pip install dist/*.tar.gz
          python -c "import dead_band; print('sdist import OK, compiled =', dead_band.CYTHON_AVAILABLE)"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only a real release publishes. A workflow_dispatch run builds the whole
    # matrix and stops, which is how to test this pipeline without burning a
    # version number on PyPI.
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true

      - name: List what is about to be published
        run: ls -lh dist

      - uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
