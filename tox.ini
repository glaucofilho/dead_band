[tox]
envlist =
    py{310,311,312,313,314}
    mypy
    flake8
    black
    isort

minversion = 4.0

[testenv]
# No PYTHONPATH, and no manual `setup.py build_ext --inplace`.
#
# tox builds this project through PEP 517 and installs the resulting wheel into
# the env, so the tests exercise the artifact a user actually installs --
# compiled extension included -- rather than the source tree with a .so dropped
# next to it. If the extension fails to build, these envs fail, which is the
# point.
deps =
    pytest
    pytest-cov
commands =
    pytest \
        --cov=dead_band \
        --cov-report=html:htmlcov/htmlcov-{envname} \
        --cov-report=xml:htmlcov/cov.xml \
        --cov-report=term-missing \
        -v

[testenv:fallback]
# Proves the pure-Python path still works when the compiled extension is absent,
# which is what a platform with no published wheel and no compiler gets. Runs
# from the source tree on purpose: nothing is built, so the guarded import in
# deadband.py has to take its fallback branch.
skip_install = true
setenv =
    PYTHONPATH = {toxinidir}/src
deps =
    pytest
commands =
    python -c "import dead_band; assert not dead_band.CYTHON_AVAILABLE, 'extension unexpectedly present'; print('CYTHON_AVAILABLE =', dead_band.CYTHON_AVAILABLE)"
    pytest tests -k "slow" -v

[testenv:mypy]
skip_install = true
deps =
    mypy
commands =
    mypy src/ --install-types --non-interactive

[testenv:flake8]
skip_install = true
deps =
    flake8
commands =
    flake8 src/ tests/

[testenv:black]
skip_install = true
deps =
    black
commands =
    black --check --diff --line-length 79 src/ tests/

[testenv:isort]
skip_install = true
deps =
    isort
commands =
    isort --check-only --diff src/ tests/

[testenv:benchmark]
# The old dev{39..313} envs collapsed into one: dev.py takes no version-specific
# behaviour, and tox already runs it under whichever interpreter is selected.
deps =
    matplotlib
commands =
    python dev.py

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
